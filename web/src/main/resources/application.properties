# ===== Base de datos (MySQL en Docker: contenedor unimotor-mysql) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/unishop?serverTimezone=UTC
spring.datasource.username=${DB_USER:unishop}
# La contrasena se puede cambiar con la variable de entorno DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:unishop}

# ===== JPA =====
# Imprime en consola las instrucciones SQL
spring.jpa.show-sql=true
# update: crea o actualiza las tablas sin borrar los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update
# Sesión de JPA abierta durante toda la petición: la API REST (mapeo a DTO) y los beans JSF cargan
# relaciones perezosas después de los servicios. Es el valor por defecto; se deja explícito para que no se apague.
spring.jpa.open-in-view=true

# ===== Subida de archivos =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
# Carpeta donde se guardan las imagenes (relativa al modulo web)
upload.url=src/main/webapp/uploads

# ===== JSF / PrimeFaces =====
joinfaces.primefaces.move-scripts-to-bottom=true

# ===== Administrador inicial (se crea al arrancar si no hay administradores) =====
unishop.admin.nombre=${ADMIN_NOMBRE:Administrador}
unishop.admin.email=${ADMIN_EMAIL:admin@unishop.com}
unishop.admin.password=${ADMIN_PASSWORD:admin123}

# ===== Correo (Fase 7): en desarrollo, Mailpit en Docker (SMTP 1025, interfaz http://localhost:8025) =====
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Remitente de los correos de UniShop
unishop.correo.remitente=${MAIL_REMITENTE:UniShop <no-responder@unishop.com>}
# URL pública de la aplicación, para los enlaces de los correos (por ejemplo, recuperar la contraseña)
unishop.url-base=${URL_BASE:http://localhost:8080}

# ===== Datos de demostración =====
# true: al arrancar carga 2 administradores, 3 vendedores, 3 compradores, 40 productos y su actividad
# (negocio/src/main/resources/demo/catalogo.json). No repite nada si ya están cargados.
unishop.demo.cargar=${DEMO_CARGAR:false}
