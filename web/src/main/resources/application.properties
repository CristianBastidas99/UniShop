# ===== Base de datos (MySQL en Docker: contenedor unimotor-mysql) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/unishop?serverTimezone=UTC
spring.datasource.username=${DB_USER:unishop}
# La contrasena se puede cambiar con la variable de entorno DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:unishop}

# ===== JPA =====
# Imprime en consola las instrucciones SQL
spring.jpa.show-sql=true
# update: crea o actualiza las tablas sin borrar los datos al reiniciar
spring.jpa.hibernate.ddl-auto=update

# ===== Subida de archivos =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB
# Carpeta donde se guardan las imagenes (relativa al modulo web)
upload.url=src/main/webapp/uploads

# ===== JSF / PrimeFaces =====
joinfaces.primefaces.move-scripts-to-bottom=true

# ===== Administrador inicial (se crea al arrancar si no hay administradores) =====
unishop.admin.nombre=${ADMIN_NOMBRE:Administrador}
unishop.admin.email=${ADMIN_EMAIL:admin@unishop.com}
unishop.admin.password=${ADMIN_PASSWORD:admin123}
