<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Restablecer contraseña</ui:define>
    <ui:define name="contenido">
        <f:metadata>
            <f:viewParam name="token" value="#{restablecerPasswordBean.token}"/>
            <f:viewAction action="#{restablecerPasswordBean.validar}"/>
        </f:metadata>

        <div class="login-caja">
            <p:panel header="Restablecer contraseña">
                <h:panelGroup layout="block" rendered="#{!restablecerPasswordBean.valido}">
                    <p>El enlace no es válido o ya venció.</p>
                    <p class="login-enlace">
                        <h:link outcome="/recuperarPassword" value="Pedir un enlace nuevo"/>
                    </p>
                </h:panelGroup>

                <h:form id="formRestablecer" rendered="#{restablecerPasswordBean.valido}">
                    <div class="login-campo">
                        <p:outputLabel for="nueva" value="Nueva contraseña"/>
                        <p:password id="nueva" value="#{restablecerPasswordBean.nueva}" feedback="false"
                                    toggleMask="true" label="Nueva contraseña" autocomplete="new-password"
                                    required="true" requiredMessage="La contraseña es obligatoria"
                                    validatorMessage="La contraseña debe tener entre 6 y 100 caracteres">
                            <f:validateLength minimum="6" maximum="100"/>
                        </p:password>
                        <small>Mínimo 6 caracteres.</small>
                        <p:message for="nueva"/>
                    </div>
                    <div class="login-campo">
                        <p:outputLabel for="confirmacion" value="Confirmar contraseña"/>
                        <p:password id="confirmacion" value="#{restablecerPasswordBean.confirmacion}" feedback="false"
                                    toggleMask="true" label="Confirmación" autocomplete="new-password"
                                    required="true" requiredMessage="Confirma la contraseña"/>
                        <p:message for="confirmacion"/>
                    </div>
                    <p:commandButton value="Cambiar contraseña" icon="pi pi-fw pi-lock"
                                     action="#{restablecerPasswordBean.restablecer}" update="@all"
                                     styleClass="login-boton"/>
                </h:form>
            </p:panel>
        </div>
    </ui:define>
</ui:composition>
