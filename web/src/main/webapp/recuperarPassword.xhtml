<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Recuperar contraseña</ui:define>
    <ui:define name="contenido">
        <div class="login-caja">
            <p:panel header="Recuperar contraseña">
                <h:form id="formRecuperar">
                    <p>Escribe el correo de tu cuenta y te enviaremos un enlace para elegir una nueva contraseña.</p>
                    <div class="login-campo">
                        <p:outputLabel for="email" value="Correo electrónico"/>
                        <p:inputText id="email" type="email" value="#{recuperarPasswordBean.email}"
                                     label="Correo electrónico" maxlength="100"
                                     required="true" requiredMessage="El correo es obligatorio"/>
                        <p:message for="email"/>
                    </div>
                    <p:commandButton value="Enviar enlace" icon="pi pi-fw pi-send"
                                     action="#{recuperarPasswordBean.enviarEnlace}" update="@form :mensajes"
                                     styleClass="login-boton"/>
                    <p class="login-enlace">
                        <h:link outcome="/login" value="Volver a iniciar sesión"/>
                    </p>
                </h:form>
            </p:panel>
        </div>
    </ui:define>
</ui:composition>
