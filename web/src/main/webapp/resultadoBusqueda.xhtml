<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Resultados de búsqueda</ui:define>
    <ui:define name="contenido">
        <p:panel header="#{busquedaBean.busquedaParam}">
            <h:form>
                <p:repeat value="#{busquedaBean.productos}" var="productos">
                    <p:panel header="#{productos.nombre}">
                        <p:outputPanel value="#{productos.descripcion}" escape="false" /><br/>
                        <p:outputLabel value="$#{productos.precio}"/>
                    </p:panel>
                </p:repeat>
            </h:form>
        </p:panel>
    </ui:define>
</ui:composition>
