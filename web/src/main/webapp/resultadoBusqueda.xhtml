<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Resultados de búsqueda</ui:define>

    <!-- Filtros por URL: resultadoBusqueda.xhtml?q=&categoria=&precioMin=&precioMax=&ciudad=&calificacion= -->
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="q" value="#{busquedaBean.q}"/>
            <f:viewParam name="categoria" value="#{busquedaBean.categoria}"/>
            <f:viewParam name="precioMin" value="#{busquedaBean.precioMin}"/>
            <f:viewParam name="precioMax" value="#{busquedaBean.precioMax}"/>
            <f:viewParam name="ciudad" value="#{busquedaBean.ciudad}"/>
            <f:viewParam name="calificacion" value="#{busquedaBean.calificacion}"/>
            <f:viewAction action="#{busquedaBean.cargar}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="contenido">
        <div class="busqueda-layout">
            <h:form id="formFiltros" styleClass="filtros">
                <h2 class="filtros-titulo">Filtros</h2>

                <div class="filtro-campo">
                    <label for="formFiltros:texto">Texto</label>
                    <p:inputText id="texto" value="#{busquedaBean.q}" placeholder="Nombre del producto"/>
                </div>

                <div class="filtro-campo">
                    <label for="formFiltros:categoria">Categoría</label>
                    <p:selectOneMenu id="categoria" value="#{busquedaBean.categoria}">
                        <f:selectItem itemLabel="Todas" itemValue=""/>
                        <f:selectItems value="#{seleccionBean.categorias}" var="cat"
                                       itemValue="#{cat.id.toString()}" itemLabel="#{cat.nombre}"/>
                    </p:selectOneMenu>
                </div>

                <div class="filtro-campo">
                    <label for="formFiltros:precioMin">Precio mínimo</label>
                    <p:inputText id="precioMin" value="#{busquedaBean.formPrecioMin}" label="Precio mínimo"
                                 converterMessage="El precio mínimo debe ser un número"
                                 validatorMessage="El precio mínimo no puede ser negativo">
                        <f:validateDoubleRange minimum="0"/>
                    </p:inputText>
                    <p:message for="precioMin"/>
                </div>

                <div class="filtro-campo">
                    <label for="formFiltros:precioMax">Precio máximo</label>
                    <p:inputText id="precioMax" value="#{busquedaBean.formPrecioMax}" label="Precio máximo"
                                 converterMessage="El precio máximo debe ser un número"
                                 validatorMessage="El precio máximo no puede ser negativo">
                        <f:validateDoubleRange minimum="0"/>
                    </p:inputText>
                    <p:message for="precioMax"/>
                </div>

                <div class="filtro-campo">
                    <label for="formFiltros:ciudad">Ciudad</label>
                    <p:selectOneMenu id="ciudad" value="#{busquedaBean.ciudad}">
                        <f:selectItem itemLabel="Todas" itemValue=""/>
                        <f:selectItems value="#{seleccionBean.ciudades}" var="ciu"
                                       itemValue="#{ciu.id.toString()}" itemLabel="#{ciu.nombre}"/>
                    </p:selectOneMenu>
                </div>

                <div class="filtro-campo">
                    <label for="formFiltros:calificacion">Calificación mínima</label>
                    <p:selectOneMenu id="calificacion" value="#{busquedaBean.calificacion}">
                        <f:selectItem itemLabel="Cualquiera" itemValue=""/>
                        <f:selectItem itemLabel="1 o más" itemValue="1"/>
                        <f:selectItem itemLabel="2 o más" itemValue="2"/>
                        <f:selectItem itemLabel="3 o más" itemValue="3"/>
                        <f:selectItem itemLabel="4 o más" itemValue="4"/>
                        <f:selectItem itemLabel="5" itemValue="5"/>
                    </p:selectOneMenu>
                </div>

                <div class="filtros-acciones">
                    <p:commandButton id="aplicar" value="Aplicar filtros" icon="pi pi-filter" ajax="false"
                                     action="#{busquedaBean.aplicar}"/>
                    <h:link id="limpiar" outcome="/resultadoBusqueda" value="Limpiar filtros" styleClass="filtros-limpiar">
                        <f:param name="q" value="#{busquedaBean.textoBuscado}"
                                 disable="#{empty busquedaBean.textoBuscado}"/>
                    </h:link>
                </div>
            </h:form>

            <section class="resultados">
                <h1 class="titulo-inicio">#{busquedaBean.titulo}</h1>
                <p class="resultados-cantidad">#{busquedaBean.cantidad}</p>

                <h:panelGroup layout="block" styleClass="sin-productos" rendered="#{empty busquedaBean.productos}">
                    No se encontraron productos con esos filtros
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="productos-grid" rendered="#{not empty busquedaBean.productos}">
                    <ui:repeat value="#{busquedaBean.productos}" var="producto">
                        <ui:include src="/WEB-INF/includes/tarjetaProducto.xhtml">
                            <ui:param name="producto" value="#{producto}"/>
                            <ui:param name="listado" value="#{busquedaBean}"/>
                        </ui:include>
                    </ui:repeat>
                </h:panelGroup>
            </section>
        </div>
    </ui:define>
</ui:composition>
