<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Subastas</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{subastasBean.cargar}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="contenido">
        <h1 class="titulo-inicio">Subastas activas</h1>

        <h:panelGroup layout="block" styleClass="sin-productos" rendered="#{empty subastasBean.subastas}">
            No hay subastas activas en este momento
        </h:panelGroup>

        <h:panelGroup layout="block" styleClass="productos-grid" rendered="#{not empty subastasBean.subastas}">
            <ui:repeat value="#{subastasBean.subastas}" var="subasta">
                <h:link outcome="/subasta" styleClass="producto-enlace">
                    <f:param name="subasta" value="#{subasta.id}"/>
                    <div class="producto-tarjeta">
                        <img class="producto-imagen" src="#{subasta.imagen}" alt="#{subasta.nombre}"/>
                        <div class="producto-info">
                            <span class="producto-nombre">#{subasta.nombre}</span>
                            <div class="producto-precios">
                                <h:outputText styleClass="precio-final" value="#{subasta.pujaMasAlta}"
                                              rendered="#{subasta.conPujas}">
                                    <f:convertNumber pattern="$#,##0"/>
                                </h:outputText>
                                <h:outputText styleClass="sin-calificaciones" value="Sin pujas"
                                              rendered="#{not subasta.conPujas}"/>
                            </div>
                            <span class="subasta-dato">#{subasta.cantidadPujas} #{subasta.cantidadPujas == 1 ? 'puja' : 'pujas'}</span>
                            <span class="subasta-dato">Termina en: <strong class="cuenta-regresiva"
                                  data-restante="#{subasta.restanteMs}"></strong></span>
                        </div>
                    </div>
                </h:link>
            </ui:repeat>
        </h:panelGroup>

        <h:outputScript library="js" name="subastas.js" target="body"/>
    </ui:define>
</ui:composition>
