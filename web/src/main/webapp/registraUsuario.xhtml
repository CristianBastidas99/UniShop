<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Registrarse</ui:define>
    <ui:define name="contenido">
        <p:panel header="Registrar usuario" styleClass="formulario">
            <h:form id="formUsuario">
                <div class="form-campo">
                    <p:outputLabel for="nombre_usuario" value="Nombre"/>
                    <p:inputText id="nombre_usuario" value="#{usuarioBean.usuario.nombre}" label="Nombre"
                                 maxlength="100" required="true" requiredMessage="El nombre es obligatorio"/>
                    <p:message for="nombre_usuario"/>
                </div>
                <div class="form-campo">
                    <p:outputLabel for="email_usuario" value="Correo electrónico"/>
                    <p:inputText type="email" id="email_usuario" value="#{usuarioBean.usuario.email}"
                                 label="Correo electrónico" maxlength="100"
                                 required="true" requiredMessage="El correo electrónico es obligatorio"/>
                    <p:message for="email_usuario"/>
                </div>
                <div class="form-campo">
                    <p:outputLabel for="password_usuario" value="Contraseña"/>
                    <p:password id="password_usuario" value="#{usuarioBean.usuario.password}" feedback="true"
                                label="Contraseña" required="true" requiredMessage="La contraseña es obligatoria"
                                promptLabel="Ingresa tu contraseña" weakLabel="Débil"
                                goodLabel="Buena" strongLabel="Fuerte"/>
                    <p:message for="password_usuario"/>
                </div>
                <div class="form-campo">
                    <p:outputLabel for="ciudad_usuario" value="Ciudad"/>
                    <p:selectOneMenu id="ciudad_usuario" value="#{usuarioBean.usuario.ciudad}"
                                     converter="#{ciudadConverter}" label="Ciudad"
                                     filter="true" filterMatchMode="contains"
                                     required="true" requiredMessage="La ciudad es obligatoria">
                        <f:selectItem itemLabel="Selecciona una ciudad" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{seleccionBean.ciudades}" var="ciudad" itemLabel="#{ciudad.nombre}"
                                       itemValue="#{ciudad}"/>
                    </p:selectOneMenu>
                    <p:message for="ciudad_usuario"/>
                </div>
                <div class="form-campo">
                    <label>Teléfono</label>
                    <small>Ejemplo: 3001234567. Puedes registrar hasta 3 teléfonos.</small>
                    <h:panelGroup id="telefonos" layout="block">
                        <ui:repeat value="#{usuarioBean.telefonos}" var="tel" varStatus="est">
                            <div class="telefono-fila">
                                <p:inputText id="telefono" value="#{tel.numero}" label="Teléfono" maxlength="16"
                                             required="#{est.first and (empty param['javax.faces.source'] or param['javax.faces.source'] eq 'formUsuario:btnRegistrar')}"
                                             requiredMessage="Escribe al menos un teléfono"
                                             validatorMessage="El teléfono debe tener entre 7 y 15 dígitos (puede empezar con +)">
                                    <ui:remove>El patrón admite vacío: JSF valida también los campos vacíos y los teléfonos extra son opcionales.
                                        El primero es obligatorio solo al pulsar Registrar, para que agregar o quitar no lo exija.</ui:remove>
                                    <f:validateRegex pattern="(\+?\d{7,15})?"/>
                                </p:inputText>
                                <p:commandButton icon="pi pi-fw pi-times" title="Quitar teléfono"
                                                 rendered="#{usuarioBean.puedeQuitarTelefono}"
                                                 action="#{usuarioBean.quitarTelefono(tel)}"
                                                 process="@this :formUsuario:telefonos"
                                                 update=":formUsuario:telefonos :mensajes"/>
                                <p:message for="telefono"/>
                            </div>
                        </ui:repeat>
                        <div>
                            <p:commandButton id="btnAgregarTelefono" value="Agregar teléfono" icon="pi pi-fw pi-plus"
                                             disabled="#{!usuarioBean.puedeAgregarTelefono}"
                                             action="#{usuarioBean.agregarTelefono}"
                                             process="@this :formUsuario:telefonos"
                                             update=":formUsuario:telefonos :mensajes"/>
                        </div>
                    </h:panelGroup>
                </div>
                <div class="form-acciones">
                    <p:commandButton id="btnRegistrar" action="#{usuarioBean.registrarUsuario}" value="Registrar"
                                     update="@form :mensajes"/>
                    <p:button outcome="/index" value="Volver"/>
                </div>
                <p class="login-enlace">
                    ¿Ya tienes cuenta? <h:link outcome="/login" value="Inicia sesión"/>
                </p>
            </h:form>
        </p:panel>
    </ui:define>
</ui:composition>
