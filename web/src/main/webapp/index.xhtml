<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Inicio</ui:define>
    <ui:define name="contenido">
        <h:form>
            <ul class="trElementEmulation">
                <p:repeat value="#{productoBean.listaProductos}" var="listaProductos">
                    <li class="trElementEmulation">
                        <p:panel header="#{listaProductos.nombre}">
                            <p:graphicImage url="#{listaProductos.misImagenes.get(0)}" library="demo" height="400" width="400"/><br/>
                            <h:outputText value="#{productos.descripcion}" escape="false" /><br/>
                            $<p:outputLabel value="#{productos.precio}"/>
                        </p:panel>
                    </li>
                </p:repeat>
            </ul>
        </h:form>
    </ui:define>
</ui:composition>
