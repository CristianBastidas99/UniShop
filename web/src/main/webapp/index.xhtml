<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Inicio</ui:define>
    <ui:define name="contenido">
        <h:form>
            <ul class="trElementEmulation">
                <p:repeat value="#{productoBean.listaProductos}" var="producto">
                    <li class="trElementEmulation">
                        <p:panel header="#{producto.nombre}">
                            <p:graphicImage url="#{producto.misImagenes[0]}" height="400" width="400"
                                            rendered="#{not empty producto.misImagenes}"/>
                            <h:panelGroup layout="block" styleClass="sin-imagen" rendered="#{empty producto.misImagenes}">Sin imagen</h:panelGroup>
                            <div class="producto-descripcion"><h:outputText value="#{producto.descripcion}"/></div>
                            <h:outputText value="#{producto.precio}">
                                <f:convertNumber pattern="$#,##0"/>
                            </h:outputText>
                        </p:panel>
                    </li>
                </p:repeat>
            </ul>
        </h:form>
    </ui:define>
</ui:composition>
