<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Inicio</ui:define>

    <!-- Filtro por categoría: index.xhtml?categoria=ID -->
    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="categoria" value="#{inicioBean.idCategoria}"/>
            <f:viewAction action="#{inicioBean.cargar}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="contenido">
        <!-- Barra de categorías: enlaces GET -->
        <nav class="categorias">
            <h:link outcome="/index" value="Todas"
                    styleClass="#{inicioBean.categoriaSeleccionada == null ? 'categoria-activa' : ''}"/>
            <ui:repeat value="#{seleccionBean.categorias}" var="categoria">
                <h:link outcome="/index" value="#{categoria.nombre}"
                        styleClass="#{inicioBean.categoriaSeleccionada == categoria.id ? 'categoria-activa' : ''}">
                    <f:param name="categoria" value="#{categoria.id}"/>
                </h:link>
            </ui:repeat>
        </nav>

        <h1 class="titulo-inicio">#{inicioBean.titulo}</h1>

        <h:panelGroup layout="block" styleClass="sin-productos" rendered="#{empty inicioBean.productos}">
            #{inicioBean.categoriaSeleccionada == null ? 'No hay productos disponibles' : 'No hay productos disponibles en esta categoría'}
        </h:panelGroup>

        <h:panelGroup layout="block" styleClass="productos-grid" rendered="#{not empty inicioBean.productos}">
            <ui:repeat value="#{inicioBean.productos}" var="producto">
                <ui:include src="/WEB-INF/includes/tarjetaProducto.xhtml">
                    <ui:param name="producto" value="#{producto}"/>
                    <ui:param name="listado" value="#{inicioBean}"/>
                </ui:include>
            </ui:repeat>
        </h:panelGroup>
    </ui:define>
</ui:composition>
