<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Publicar producto</ui:define>
    <ui:define name="contenido">
        <p:panel header="Registrar producto" styleClass="formulario">
            <h:form id="formProducto">
                <f:event type="postValidate" listener="#{productoBean.validarImagenes}"/>

                <div class="form-campo">
                    <p:outputLabel for="nombre_producto" value="Nombre"/>
                    <p:inputText id="nombre_producto" value="#{productoBean.producto.nombre}" label="Nombre"
                                 maxlength="100" required="true" requiredMessage="El nombre es obligatorio"/>
                    <p:message for="nombre_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="cantidad_producto" value="Unidades"/>
                    <p:inputText id="cantidad_producto" value="#{productoBean.producto.unidades}" label="Unidades"
                                 required="true" requiredMessage="Las unidades son obligatorias"
                                 converterMessage="Las unidades deben ser un número entero (por ejemplo 5)"
                                 validatorMessage="Las unidades deben ser un número entero mayor que 0">
                        <f:validateLongRange minimum="1"/>
                    </p:inputText>
                    <p:message for="cantidad_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="descripcion_producto" value="Descripción"/>
                    <p:textEditor id="descripcion_producto" value="#{productoBean.producto.descripcion}" height="300"
                                  secure="false" label="Descripción"
                                  required="true" requiredMessage="La descripción es obligatoria"/>
                    <p:message for="descripcion_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="precio_producto" value="Precio"/>
                    <p:inputText id="precio_producto" value="#{productoBean.producto.precio}" label="Precio"
                                 required="true" requiredMessage="El precio es obligatorio"
                                 converterMessage="El precio debe ser un número (por ejemplo 25000)"
                                 validatorMessage="El precio debe ser mayor que 0">
                        <f:validateDoubleRange minimum="0.01"/>
                    </p:inputText>
                    <p:message for="precio_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="descuento_producto" value="Descuento (0 a 1)"/>
                    <p:inputText id="descuento_producto" value="#{productoBean.producto.descuento}"
                                 label="Descuento"
                                 converterMessage="El descuento debe ser un número entre 0 y 1 (por ejemplo 0.25)"
                                 validatorMessage="El descuento debe estar entre 0 y 1 (0.25 equivale a 25 %)">
                        <f:validateDoubleRange minimum="0" maximum="1"/>
                    </p:inputText>
                    <small>Opcional. Usa punto decimal: 0.25 equivale a 25 % de descuento.</small>
                    <p:message for="descuento_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="fecha_limite_producto" value="Fecha límite de la publicación"/>
                    <p:datePicker id="fecha_limite_producto" value="#{productoBean.producto.fechaLimite}"
                                  label="Fecha límite" pattern="dd/MM/yyyy" mindate="#{productoBean.manana}"
                                  showIcon="true" readonlyInput="true"
                                  required="true" requiredMessage="La fecha límite es obligatoria"
                                  validator="#{productoBean.validarFechaLimite}"/>
                    <p:message for="fecha_limite_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="ciudad_producto" value="Ciudad"/>
                    <p:selectOneMenu id="ciudad_producto" value="#{productoBean.producto.ciudad}"
                                     converter="#{ciudadConverter}" label="Ciudad"
                                     filter="true" filterMatchMode="contains"
                                     required="true" requiredMessage="La ciudad es obligatoria">
                        <f:selectItem itemLabel="Selecciona una ciudad" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{seleccionBean.ciudades}" var="ciudad" itemLabel="#{ciudad.nombre}"
                                       itemValue="#{ciudad}"/>
                    </p:selectOneMenu>
                    <p:message for="ciudad_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="categorias_producto" value="Categorías"/>
                    <p:selectCheckboxMenu id="categorias_producto" value="#{productoBean.categoriasSeleccionadas}"
                                          converter="#{categoriaConverter}" label="Selecciona una o más categorías"
                                          multiple="true" filter="true" filterMatchMode="contains"
                                          required="true" requiredMessage="Selecciona al menos una categoría">
                        <f:selectItems value="#{seleccionBean.categorias}" var="categoria"
                                       itemLabel="#{categoria.nombre}" itemValue="#{categoria}"/>
                    </p:selectCheckboxMenu>
                    <p:message for="categorias_producto"/>
                </div>

                <div class="form-campo">
                    <p:outputLabel for="imagenes_producto" value="Imágenes (al menos una)"/>
                    <p:fileUpload id="imagenes_producto"
                                  listener="#{productoBean.subirImagenes}" mode="advanced"
                                  multiple="true" sizeLimit="1000000" fileLimit="5"
                                  allowTypes="/(\.|\/)(gif|jpe?g|png)$/"
                                  label="Elegir imágenes" uploadLabel="Subir" cancelLabel="Cancelar"
                                  invalidFileMessage="Solo se permiten imágenes gif, jpg o png"
                                  invalidSizeMessage="Cada imagen debe pesar máximo 1 MB"
                                  fileLimitMessage="Máximo 5 imágenes" update=":mensajes"/>
                    <p:message for="imagenes_producto"/>
                </div>

                <div class="form-acciones">
                    <p:commandButton id="botonRegistrar" action="#{productoBean.registrarProducto}" value="Registrar"
                                     update="@form :mensajes"/>
                    <p:button outcome="/index" value="Volver"/>
                </div>
            </h:form>
        </p:panel>
    </ui:define>
</ui:composition>
