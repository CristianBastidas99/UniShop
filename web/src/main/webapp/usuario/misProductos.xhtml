<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="titulo">UniShop - Mis productos</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{misProductosBean.cargar}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="contenido">
        <h:panelGroup id="zonaProductos" layout="block">
            <h1 class="titulo-inicio">Mis productos (#{misProductosBean.productos.size()})</h1>

            <h:panelGroup layout="block" styleClass="sin-productos" rendered="#{empty misProductosBean.productos}">
                Aún no has publicado productos
                <p><h:link outcome="/usuario/registraProducto" value="Publicar producto"/></p>
            </h:panelGroup>

            <h:form id="formLista" rendered="#{not empty misProductosBean.productos}">
                <p:dataTable id="tablaProductos" value="#{misProductosBean.productos}" var="fila" reflow="true">
                    <p:column headerText="Producto">
                        <div class="carrito-producto">
                            <img class="carrito-imagen" src="#{fila.imagen}" alt="#{fila.nombre}"/>
                            <h:link outcome="/detalleProducto" value="#{fila.nombre}">
                                <f:param name="producto" value="#{fila.id}"/>
                            </h:link>
                        </div>
                    </p:column>
                    <p:column headerText="Precio">
                        <h:outputText value="#{fila.precio}"><f:convertNumber pattern="$#,##0"/></h:outputText>
                    </p:column>
                    <p:column headerText="Descuento">
                        <h:outputText value="#{fila.porcentaje} %" rendered="#{fila.conDescuento}"/>
                        <h:outputText value="Sin descuento" rendered="#{!fila.conDescuento}"/>
                    </p:column>
                    <p:column headerText="Precio final">
                        <h:outputText value="#{fila.precioFinal}"><f:convertNumber pattern="$#,##0"/></h:outputText>
                    </p:column>
                    <p:column headerText="Unidades">
                        <h:outputText value="#{fila.unidades}"/>
                    </p:column>
                    <p:column headerText="Fecha límite">
                        <h:outputText value="#{fila.fechaLimite}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/Bogota"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Estado">
                        <h:outputText value="#{fila.estado}"
                                      styleClass="estado-producto #{fila.vigente ? 'estado-vigente' : 'estado-inactivo'}"/>
                    </p:column>
                    <p:column headerText="Acciones">
                        <div class="acciones-producto">
                            <p:button value="Editar" icon="pi pi-fw pi-pencil" outcome="/usuario/registraProducto">
                                <f:param name="producto" value="#{fila.id}"/>
                            </p:button>
                            <p:button value="Subastar" icon="pi pi-fw pi-clock" outcome="/usuario/crearSubasta"
                                      rendered="#{fila.vigente and not fila.enSubasta}">
                                <f:param name="producto" value="#{fila.id}"/>
                            </p:button>
                            <p:button value="Ver subasta" icon="pi pi-fw pi-clock" outcome="/subasta"
                                      styleClass="ui-button-success" rendered="#{fila.enSubasta}">
                                <f:param name="subasta" value="#{fila.idSubastaActiva}"/>
                            </p:button>
                            <p:commandButton value="#{fila.conDescuento ? 'Cambiar descuento' : 'Poner descuento'}"
                                             icon="pi pi-fw pi-tag" styleClass="ui-button-info"
                                             action="#{misProductosBean.prepararDescuento(fila)}"
                                             process="@this" update=":formDescuento"
                                             oncomplete="PF('dlgDescuento').show()"/>
                            <p:commandButton value="Quitar descuento" icon="pi pi-fw pi-times"
                                             styleClass="ui-button-secondary" rendered="#{fila.conDescuento}"
                                             action="#{misProductosBean.quitarDescuento(fila)}"
                                             process="@this" update=":zonaProductos :mensajes"/>
                            <p:commandButton value="Eliminar" icon="pi pi-fw pi-trash" styleClass="ui-button-danger"
                                             action="#{misProductosBean.prepararEliminar(fila)}"
                                             process="@this" update=":formEliminar"
                                             oncomplete="PF('dlgEliminar').show()"/>
                        </div>
                    </p:column>
                </p:dataTable>
            </h:form>
        </h:panelGroup>

        <p:dialog header="Descuento" widgetVar="dlgDescuento" modal="true" resizable="false" draggable="false"
                  styleClass="dialogo-producto">
            <h:form id="formDescuento">
                <p>Producto: <strong>#{misProductosBean.nombreSeleccionado}</strong></p>
                <div class="form-campo">
                    <p:outputLabel for="porcentaje" value="Porcentaje de descuento (1 a 99)"/>
                    <p:spinner id="porcentaje" value="#{misProductosBean.porcentaje}" min="1" max="99"
                               label="Porcentaje" converterMessage="Escribe un número entero entre 1 y 99"/>
                    <p:message for="porcentaje"/>
                </div>
                <div class="form-acciones">
                    <p:commandButton value="Aplicar" icon="pi pi-fw pi-check"
                                     action="#{misProductosBean.guardarDescuento}"
                                     update="@form :zonaProductos :mensajes"/>
                    <p:commandButton value="Cancelar" type="button" styleClass="ui-button-secondary"
                                     onclick="PF('dlgDescuento').hide()"/>
                </div>
            </h:form>
        </p:dialog>

        <p:confirmDialog widgetVar="dlgEliminar" header="Eliminar producto" severity="warn"
                         message="Se eliminará el producto. Si ya tiene compras, comentarios u otra actividad no se borra: queda invalidado y deja de mostrarse al público.">
            <h:form id="formEliminar">
                <p>Producto: <strong>#{misProductosBean.nombreSeleccionado}</strong></p>
                <p:commandButton value="Sí, eliminar" icon="pi pi-fw pi-check" styleClass="ui-button-danger"
                                 action="#{misProductosBean.eliminar}"
                                 update=":zonaProductos :mensajes" oncomplete="PF('dlgEliminar').hide()"/>
                <p:commandButton value="Cancelar" type="button" icon="pi pi-fw pi-times"
                                 styleClass="ui-button-secondary" onclick="PF('dlgEliminar').hide()"/>
            </h:form>
        </p:confirmDialog>
    </ui:define>
</ui:composition>
