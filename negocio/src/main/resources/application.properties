# ===== Base de datos (MySQL en Docker: contenedor unimotor-mysql) =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/unishop?serverTimezone=UTC
spring.datasource.username=${DB_USER:unishop}
# La contrasena se puede cambiar con la variable de entorno DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:unishop}

# ===== JPA =====
# Imprime en consola las instrucciones SQL
spring.jpa.show-sql=true
# create: cada ejecucion de las pruebas empieza con la base limpia
spring.jpa.hibernate.ddl-auto=create
# Sesión de JPA abierta durante toda la petición: la API REST (mapeo a DTO) y los beans JSF cargan
# relaciones perezosas después de los servicios. Es el valor por defecto; se deja explícito para que no se apague.
spring.jpa.open-in-view=true
